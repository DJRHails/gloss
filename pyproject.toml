[project]
name = "gloss"
version = "0.1.0"
description = "A benchmark for chain-of-thought legibility: can a monitor reconstruct game state and proposed lines from a reasoning trace it did not write?"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.10",
    "loguru>=0.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.scripts]
gloss = "gloss.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "ty>=0.0.1a19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gloss"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C901", "RET", "SIM", "TID252"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
